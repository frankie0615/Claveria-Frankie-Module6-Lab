<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="container">

        <div class="card">

            <h1>Student Registration Form</h1>
            <p class="subtitle">IT Seminar Registration</p>

            <form id="registrationForm" novalidate>

                <!-- FULL NAME -->
                <div class="form-group">
                    <label for="fullName">Full Name</label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        autocomplete="name"
                        aria-describedby="fullNameError"
                        aria-invalid="false"
                    >

                    <small id="fullNameError" class="error"></small>
                </div>

                <!-- STUDENT NUMBER -->
                <div class="form-group">
                    <label for="studentNumber">Student Number</label>

                    <input
                        type="text"
                        id="studentNumber"
                        name="studentNumber"
                        placeholder="24-1234-123"
                        aria-describedby="studentNumberError"
                        aria-invalid="false"
                    >

                    <small id="studentNumberError" class="error"></small>
                </div>

                <!-- EMAIL -->
                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        aria-describedby="emailError"
                        aria-invalid="false"
                    >

                    <small id="emailError" class="error"></small>
                </div>

                <!-- MOBILE -->
                <div class="form-group">
                    <label for="mobileNumber">Mobile Number</label>

                    <input
                        type="tel"
                        id="mobileNumber"
                        name="mobileNumber"
                        placeholder="09171234567"
                        aria-describedby="mobileNumberError"
                        aria-invalid="false"
                    >

                    <small id="mobileNumberError" class="error"></small>
                </div>

                <!-- PASSWORD -->
                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        aria-describedby="passwordFeedback passwordError"
                        aria-invalid="false"
                    >

                    <small id="passwordFeedback" class="feedback"></small>
                    <small id="passwordError" class="error"></small>
                </div>

                <!-- CONFIRM PASSWORD -->
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        aria-describedby="confirmPasswordError"
                        aria-invalid="false"
                    >

                    <small id="confirmPasswordError" class="error"></small>
                </div>

                <!-- COURSE -->
                <div class="form-group">
                    <label for="course">Course</label>

                    <select
                        id="course"
                        name="course"
                        aria-describedby="courseError"
                        aria-invalid="false"
                    >
                        <option value="">Select your course</option>
                        <option value="BSIT">BSIT</option>
                        <option value="BSCS">BSCS</option>
                    </select>

                    <small id="courseError" class="error"></small>
                </div>

                <!-- TERMS -->
                <div class="terms">
                    <div class="checkbox-row">
                        <input
                            type="checkbox"
                            id="terms"
                            name="terms"
                            aria-describedby="termsError"
                            aria-invalid="false"
                        >

                        <label for="terms">
                            I agree to the terms and conditions.
                        </label>
                    </div>

                    <small id="termsError" class="error"></small>
                </div>

                <!-- BUTTONS -->
                <div class="buttons">
                    <button type="submit" id="registerBtn">
                        Register
                    </button>

                    <button type="reset" id="resetBtn">
                        Reset
                    </button>
                </div>

            </form>

            <!-- SUCCESS -->
            <div
                id="successMessage"
                class="success"
                role="status"
                aria-live="polite"
            ></div>

            <!-- SUMMARY -->
            <section
                id="registrationSummary"
                class="summary"
                hidden
            >

                <h2>Registration Summary</h2>

                <p>
                    <strong>Full Name:</strong>
                    <span id="summaryName"></span>
                </p>

                <p>
                    <strong>Student Number:</strong>
                    <span id="summaryStudentNumber"></span>
                </p>

                <p>
                    <strong>Email:</strong>
                    <span id="summaryEmail"></span>
                </p>

                <p>
                    <strong>Mobile Number:</strong>
                    <span id="summaryMobileNumber"></span>
                </p>

                <p>
                    <strong>Course:</strong>
                    <span id="summaryCourse"></span>
                </p>

            </section>

        </div>

    </main>

    <script src="js/app.js"></script>

</body>
</html>
